name: Offline numerical replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/replay_results.py
      - run: python -B tools/replay_extension_results.py
      - run: python -B scripts/replay_repair_localization.py --public-root .
